[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trizod"
version = "0.0.1"
description = "Modern disorder scores for BMRB data"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.9"
authors = [
    { name = "Markus Haak", email = "m.haak@tum.de" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "tqdm",
    "pandarallel",
    "pynmrstar",
    "scipy",
]

[project.urls]
Repository = "https://github.com/tsenoner/trizod"

[project.scripts]
trizod = "trizod.trizod:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
exclude = ["trizod/potenci/legacy/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "N803",   # argument name should be lowercase (scientific convention: T, Ion, pH, etc.)
    "N806",   # variable name should be lowercase (scientific convention: N, I, E, etc.)
    "N802",   # function name should be lowercase (legacy POTENCI naming: predPentShift, etc.)
    "N816",   # mixed-case variable in global scope (AAstandard, CENTSHIFTS, etc.)
    "N818",   # exception name should end in Error (legacy naming: Found, etc.)
    "E741",   # ambiguous variable name (l, I, E — standard in scientific code)
    "E501",   # line too long (formatter handles what it can; remaining are data/strings)
    "SIM115", # open file with context handler (legacy POTENCI CSV I/O)
]

[tool.ruff.lint.isort]
known-first-party = ["trizod"]
